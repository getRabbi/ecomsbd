# ecomsbd local stack.
#
# Postgres and Redis only. The API and worker run on the host during
# development so reloads are instant; `--profile app` starts them in containers
# to check the image the way it will deploy.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecomsbd-postgres
    environment:
      POSTGRES_USER: ecomsbd
      POSTGRES_PASSWORD: ecomsbd
      POSTGRES_DB: ecomsbd
      # Deterministic collation: index ordering must not vary by host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomsbd -d ecomsbd"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecomsbd-redis
    # appendonly: rate-limit counters and locks are cheap to lose, but the ARQ
    # job queue is not.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    container_name: ecomsbd-api
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://ecomsbd:ecomsbd@postgres:5432/ecomsbd
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    container_name: ecomsbd-worker
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://ecomsbd:ecomsbd@postgres:5432/ecomsbd
      REDIS_URL: redis://redis:6379/0
      # ARQ schedules crons on host local time. Business dates and the Friday
      # summary are computed in Asia/Dhaka from UTC instants, so the container
      # clock must be UTC for the cron hours to mean what the code says.
      TZ: UTC
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["arq", "app.worker.main.WorkerSettings"]

volumes:
  postgres_data:
  redis_data:
