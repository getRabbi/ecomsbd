name: ecomsbd
description: "ecomsbd — Bangladesh F-commerce seller financial operations."
publish_to: "none"

# version+build. The build number is what Play orders releases by.
version: 3.0.3+303

environment:
  sdk: ^3.12.0

dependencies:
  app_links: ^7.2.1
  url_launcher: ^6.3.2
  flutter:
    sdk: flutter

  # State management (master spec section 29).
  flutter_riverpod: ^2.6.1

  # Local database and the offline mutation outbox (section 37).
  drift: ^2.21.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # HTTP. `dio` is used for its interceptor pipeline: token refresh, trace-id
  # propagation and the idempotency-key header all belong in one place rather
  # than at each call site.
  dio: ^5.7.0

  # Tokens are stored in the Android keystore, never in shared preferences.
  flutter_secure_storage: ^9.2.2

  # Native provider credentials are exchanged only by Supabase Auth.
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0

  # Routing.
  go_router: ^14.6.1

  # Client-generated ids for offline records (section 37: UUIDv7/UUID).
  uuid: ^4.5.1

  # Bangla/English numeral and date formatting.
  intl: ^0.20.2

  # Material/Cupertino strings for the two supported locales. Ships with
  # the SDK, so adding it downloads nothing.
  flutter_localizations:
    sdk: flutter

  # The selected language, persisted across restarts. Not secret, so it
  # does not belong in the keystore-backed token store.
  shared_preferences: ^2.3.3

  # The system file browser, for choosing a CSV to import (master spec
  # section 7.3). Android has no way to open a document picker without a
  # platform channel, and this is the maintained wrapper for one.
  file_picker: ^11.0.3

  # @immutable on value classes. Transitively present via Flutter, declared
  # explicitly because this package imports it directly.
  meta: ^1.15.0

  # Device metadata reported at sign-in, and the low-end tier heuristic that
  # decides whether expensive blur is affordable (section 53).
  device_info_plus: ^11.1.1
  package_info_plus: ^8.1.1
  supabase_flutter: ^2.17.2
  crypto: ^3.0.7
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  # Whether the phone has any network at all, so the offline banner appears
  # (and recovery starts) the moment Wi-Fi or data drops or returns instead of
  # on the next failed request. It is only a hint: reaching the API is still
  # what decides "online" (lib/core/network/network_monitor.dart).
  connectivity_plus: ^7.3.1

  # Deliberately NOT included:
  #   - a chart package: every chart in the prototype is a CustomPainter, which
  #     keeps the glass styling exact and adds no dependency (docs/ADR/0002).
  #   - a WebView: the UI is native Flutter.
  #   - google_fonts: Reddit Sans is bundled, so first paint needs no network.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  http: ^1.6.0

  # Generates the launcher icons from the sources in assets/icon (configured
  # at the end of this file). Build-time only; nothing from it ships in the app.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    # The brand mark on transparency, shown in-app by EcomsBrandMark and
    # EcomsAnimatedLogo. Derived from logo_mark.png, the mark as delivered on
    # white: only the white backdrop and its drop shadow are removed and the
    # canvas padded; the artwork's own pixels are unchanged. The other files in
    # assets/icon are icon sources, read only when launcher icons are generated,
    # and are deliberately not bundled.
    - assets/icon/logo_mark_transparent.png

  fonts:
    # Reddit Sans is the product typeface (locked UI direction).
    - family: RedditSans
      fonts:
        - asset: assets/fonts/RedditSans-400.ttf
          weight: 400
        - asset: assets/fonts/RedditSans-500.ttf
          weight: 500
        - asset: assets/fonts/RedditSans-600.ttf
          weight: 600
        - asset: assets/fonts/RedditSans-700.ttf
          weight: 700
        - asset: assets/fonts/RedditSans-800.ttf
          weight: 800

    # Bangla is the primary seller-facing language (master spec section 52).
    # Reddit Sans has no Bengali coverage, so this is the fallback family.
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-700.ttf
          weight: 700

# Launcher icons. Regenerate with `dart run flutter_launcher_icons`.
#
# Every source is derived from assets/icon/logo_mark.png, the brand mark as
# delivered on white:
#   logo_mark_transparent.png  the mark with the backdrop removed. The adaptive
#       foreground insets it 23% per side, which keeps every opaque pixel inside
#       the centred 66dp circle no launcher mask crops (19.3% is the minimum),
#       over the white the mark was delivered on.
#   logo_mark_monochrome.png   a one-colour silhouette on the same canvas, for
#       Android 13+ themed icons. The status-bar icon
#       (res/drawable-*/ic_stat_ecomsbd.png) is the same silhouette.
#   icon.png                   the mark on white, framed as the adaptive icon
#       appears under a square mask: the legacy (API 24-25) icon and the store
#       icon source.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  # The package cannot read `flutter.minSdkVersion` from build.gradle.kts;
  # this is the value the Flutter toolchain supplies.
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo_mark_transparent.png"
  adaptive_icon_foreground_inset: 23
  adaptive_icon_monochrome: "assets/icon/logo_mark_monochrome.png"
  # iOS: there is no ios/ project yet, and generating into a missing one fails.
  # After `flutter create --platforms=ios .`, set this to true and regenerate;
  # iOS applies its own mask to the full square, which this source suits.
  # icon.png has no alpha channel; remove_alpha_ios guards against a future
  # export that does, which the App Store would reject.
  ios: false
  remove_alpha_ios: true
