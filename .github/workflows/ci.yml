# ecomsbd CI (master spec section 114).
#
# The backend suite runs twice: once on SQLite, which is fast and needs no
# services, and once against real PostgreSQL. ADR 0004 explains why both are
# necessary — a SQLite-only green build is not evidence that production works,
# because `FOR UPDATE SKIP LOCKED` and integrity-error behaviour differ.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  FLUTTER_VERSION: "3.44.1"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecomsbd
          POSTGRES_PASSWORD: ecomsbd
          POSTGRES_DB: ecomsbd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecomsbd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests migrations

      - name: Format check
        run: ruff format --check app tests migrations

      - name: Type check
        run: mypy

      - name: Tests (SQLite)
        run: pytest -q

      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://ecomsbd:ecomsbd@localhost:5432/ecomsbd_test
        run: pytest -q

      - name: Migration sanity — apply from empty against PostgreSQL
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://ecomsbd:ecomsbd@localhost:5432/ecomsbd_test
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic downgrade base

      - name: Dependency vulnerabilities
        # Advisory rather than blocking: a new advisory against a transitive
        # dependency should be seen the morning it lands, not silently turn
        # every build red until someone upstream ships a fix. The release gate
        # in docs/RELEASE_READINESS.md is where it has to be clean.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner=off

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install
        run: flutter pub get

      - name: Generate
        run: dart run build_runner build

      - name: Format check
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Narrow, per-value allowlist for redaction-test fixtures. See the
          # file for why each entry is safe.
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Refuse a committed .env
        run: |
          if git ls-files --error-unmatch backend/.env >/dev/null 2>&1; then
            echo "::error::backend/.env is tracked. Secrets must never be committed."
            exit 1
          fi

  restore-drill:
    name: Backup restore drill
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecomsbd
          POSTGRES_PASSWORD: ecomsbd
          POSTGRES_DB: ecomsbd_source
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecomsbd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Build a database to back up
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://ecomsbd:ecomsbd@localhost:5432/ecomsbd_source
        run: alembic upgrade head

      # Master spec section 48: "do not claim backup safety unless restore has
      # been tested." Running the drill on every build is the only way that
      # claim stays true as the schema changes.
      - name: Dump
        run: |
          pg_dump --dbname=postgresql://ecomsbd:ecomsbd@localhost:5432/ecomsbd_source             --format=custom --compress=9 --no-owner --no-acl             --file=/tmp/ecomsbd-ci.dump
          test "$(wc -c < /tmp/ecomsbd-ci.dump)" -gt 4096

      - name: Restore into a separate database
        run: |
          psql postgresql://ecomsbd:ecomsbd@localhost:5432/postgres             -c "CREATE DATABASE ecomsbd_restore_ci"
          pg_restore --dbname=postgresql://ecomsbd:ecomsbd@localhost:5432/ecomsbd_restore_ci             --no-owner --no-acl /tmp/ecomsbd-ci.dump

      - name: Verify the restored database
        env:
          DATABASE_URL: postgresql+asyncpg://ecomsbd:ecomsbd@localhost:5432/ecomsbd_restore_ci
        run: python infra/backup/verify_restore.py

  docker:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f infra/docker/backend.Dockerfile -t ecomsbd-backend:ci backend
