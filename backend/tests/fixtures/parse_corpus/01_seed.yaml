# Order-parse corpus (V4 WP0.3). Each case: `text`, `expect` (graded fields;
# a field left out is not graded) and `llm` — the extraction-tool input the
# fake AI client returns for this text. The `llm` blocks are authored fixtures
# in the exact tool schema, not captures from the live API; live accuracy is
# measured by the operator with `python -m app.orders.parser.eval --live`.
# Phones in authored cases use the 017000000xx test range.

- id: seed-01
  text: "নাম: রহিম উদ্দিন\nফোন: 01712345678\nঠিকানা: বাড়ি ১২, রোড ৫, মিরপুর ১০, ঢাকা\nকালো পাঞ্জাবি XL ২টা\nমোট: ২৪৫০ টাকা"
  expect:
    customer_name: রহিম উদ্দিন
    phones: ["+8801712345678"]
    address: "বাড়ি 12, রোড 5, মিরপুর 10, ঢাকা"
    items: [{name: কালো পাঞ্জাবি, quantity: 2, size: XL}]
    cod_amount_paisa: 245000
  llm:
    customer_name: রহিম উদ্দিন
    phones: ["01712345678"]
    address: "বাড়ি ১২, রোড ৫, মিরপুর ১০, ঢাকা"
    district: Dhaka
    thana: Mirpur
    items: [{name: কালো পাঞ্জাবি, quantity: 2, size: XL, color: কালো, unit_price_paisa: null}]
    cod_amount_paisa: 245000
    notes: null
    field_confidence: {customer_name: 0.97, phones: 0.99, address: 0.95, items: 0.9, cod_amount_paisa: 0.95}

