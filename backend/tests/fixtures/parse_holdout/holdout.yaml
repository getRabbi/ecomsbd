# Held-out order messages (V4 WP0.3, operator correction 2026-11-18).
#
# NEVER used to tune the parser, and NOT a pass/fail test. It measures how the
# parser does on messages its author did not write. Report:
#   python -m app.orders.parser.eval --live --set holdout
# (deterministic-only and merged accuracy, printed separately; needs
# AI_PARSE_API_KEY and AI_PARSE_MODEL). Gate G0.3 is measured here.
#
# Cases h-01..h-08 are the operator's, verbatim except that phone numbers are
# masked to the 017000000xx test range with their original separators and
# digit script kept. Add 30-50 real seller messages the same way (mask phones;
# keep everything else as typed). No `llm` blocks belong in this file.

- id: h-01
  text: "vaiya amake 1 ta black hoodie XXL pathan. ami sakib, chandpur sadar, phone 01700000021"
  expect:
    customer_name: sakib
    phones: ["+8801700000021"]
    address: chandpur sadar
    items: [{name: black hoodie, quantity: 1, size: XXL}]
    cod_amount_paisa: null

- id: h-02
  text: "অর্ডার কনফার্ম করছি\nমোঃ জাকির হোসেন\n০১৭০০-০০০০২২\nগ্রাম: চরপাড়া, ডাকঘর: বেলকুচি, জেলা: সিরাজগঞ্জ\nশাড়ি নীল ১ পিস"
  expect:
    customer_name: মোঃ জাকির হোসেন
    phones: ["+8801700000022"]
    address: "গ্রাম: চরপাড়া, ডাকঘর: বেলকুচি, জেলা: সিরাজগঞ্জ"
    items: [{name: শাড়ি, color: নীল, quantity: 1}]
    cod_amount_paisa: null

- id: h-03
  text: "Hi, I want the leather wallet (brown) x1 and belt x1. Deliver to Flat 3B, House 22, Road 11, Banani, Dhaka. Contact: +8801700000023. Name: Nadia"
  expect:
    customer_name: Nadia
    phones: ["+8801700000023"]
    address: "Flat 3B, House 22, Road 11, Banani, Dhaka"
    items: [{name: leather wallet, color: brown, quantity: 1}, {name: belt, quantity: 1}]
    cod_amount_paisa: null

