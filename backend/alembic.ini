[alembic]
script_location = migrations
prepend_sys_path = .
# UTC, sortable, and the slug keeps `ls migrations/versions` readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
# Explicit, so Alembic does not fall back to splitting paths on spaces.
path_separator = os

# sqlalchemy.url is intentionally absent: the URL comes from DATABASE_URL via
# app.core.config, so a migration can never run against a different database
# than the application reads.

# No post-write hooks: they resolve tools from the ambient environment, which
# differs between a laptop, CI and a container. Formatting and linting run as
# an explicit step (make lint) instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
