# A district outside Dhaka, Gazipur and Narayanganj is OUTSIDE_DHAKA. Those
# three districts hold both the city and its suburbs, so for them the zone
# comes only from a named area below; a bare "Gazipur" or "Dhaka" is unknown
# (null), never guessed. Spellings are matched on word boundaries,
# case-insensitively, after NFC normalisation. Add spellings, never guesses.

