# RedX courier — provider integration manifest
#
# Master spec sections 61, 74, 140.
#
# STATUS: implemented against RedX's own developer documentation,
# https://redx.com.bd/developer-api/ — the "Open API" and "Webhook" sections of
# the RedX merchant site. The page renders in the browser from a script RedX
# serves; its endpoint table, status table and delivery-type table are data in
# that script and were transcribed from it on 2026-09-23. The normalized
# reading is committed at docs/providers/redx/CONTRACT.md.
#
# This replaces the earlier "no documentation found" record. That search looked
# for a machine-readable spec on openapi.redx.com.bd and for
# redx.com.bd/api-documentation; the developer page is where RedX actually
# publishes its contract.
#
# Every `true` below names the documented endpoint and the ecomsbd code path
# that calls it. Every `false` means RedX's Open API has no such endpoint — not
# "we have not got to it" — which is why the UI shows the manual alternative
# rather than a disabled button.
#
# Promoting an `unknown` to `true` requires, and must be recorded here:
#   1. the documentation that describes it, and its date; or
#   2. a non-destructive live call proving the shape of the response.

provider: redx
display_name: RedX
verified_at: 2026-09-23
documentation_source: >
  RedX developer documentation, https://redx.com.bd/developer-api/ (Open API:
  Configuration, Track Parcel, Get Parcel Details, Create Parcel, Update
  Parcel, Get Areas, Get Pickup Stores, Pickup Store Details, Calculate Parcel
  Charge; Webhook: Callback URL Structure, Sample Request Format, Status
  Updates and Meanings, Delivery Type Reference Table). Normalized reading
  committed at docs/providers/redx/CONTRACT.md.

documentation_version: "Open API v1.0.0-beta (redx.com.bd/developer-api)"
base_url: https://openapi.redx.com.bd/v1.0.0-beta
auth_model: >
  One bearer token per environment, generated by the merchant on RedX's
  developer page ("Request token"), sent on every call as the header
  `API-ACCESS-TOKEN: Bearer <token>`. No login call and no refresh contract.
  Sandbox host https://sandbox.redx.com.bd/v1.0.0-beta takes its own sandbox
  token; the environment is chosen per courier account. Both hosts answer an
  unknown or missing token with 401 JSON.

capabilities:
  credential_validation: true
  create_single: true
  status_lookup: true
  cancel: true
  list_stores: true
  location_lookup: true
  price_quote: true
  webhook: true

  # No such endpoint exists in RedX's Open API. Not pending — absent.
  create_bulk: false
  returns: false
  balance: false
  payouts: false
  payments: false
  payment_consignments: false
  customer_stats: false
  # delivery_area and delivery_area_id are required on every create, and the
  # documentation says nothing about resolving a free-text address.
  auto_address: false

endpoints:
  credential_validation:
    endpoint: /pickup/stores
    method: GET
    request_model: API-ACCESS-TOKEN header only
    response_model: "{pickup_stores: [{id, name, address, area_name, area_id, phone, created_at}]}"
    live_credentials_required: false
    notes: >
      RedX documents no "who am I" call. Listing the merchant's own pickup
      stores is the safest documented read that is specific to the account:
      it changes nothing, and a parcel is never created to test a token.

  create_single:
    endpoint: /parcel
    method: POST
    request_model: >
      customer_name*, customer_phone*, delivery_area*, delivery_area_id*,
      customer_address*, cash_collection_amount* (string, taka),
      parcel_weight* (grams), value*, merchant_invoice_id, instruction,
      pickup_store_id. type, parcel_details_json and is_closed_box are never
      sent.
    response_model: "{tracking_id}"
    live_credentials_required: true
    notes: >
      The tracking id is RedX's only parcel identifier; it is stored as both
      the provider consignment id and the tracking code. The create response
      carries no status and no charge. What RedX does with a repeated
      merchant_invoice_id is undocumented; see PROVIDER_CREATE_IDEMPOTENCY.

  status_lookup:
    endpoint: /parcel/info/{tracking_id}
    method: GET
    request_model: path parameter only
    response_model: "{parcel: {tracking_id, status, delivery_type, charge, cash_collection_amount, merchant_invoice_id, ...}}"
    live_credentials_required: true
    notes: >
      Polled on the same adaptive schedule as Steadfast. The status is read
      together with delivery_type: a final status settles a parcel only on a
      `regular` parcel (or, for `delivered`, a `partial-delivery` one, which
      then waits for a person to supply quantities). GET /parcel/track/{id}
      (a message history) is also documented and implemented in the RedX
      client; no screen shows it yet.

  cancel:
    endpoint: /parcels
    method: PATCH
    request_model: >
      {entity_type: "parcel-tracking-id", entity_id: <tracking_id>,
      update_details: {property_name: "status", new_value: "cancelled", reason}}
    response_model: "{success, message}"
    live_credentials_required: true
    notes: >
      Sent exactly once. Not offered in the app yet; the adapter implements it
      so a cancel is never improvised against an undocumented path.

  list_stores:
    endpoint: /pickup/stores, /pickup/store/info/{pickup_store_id}
    method: GET
    request_model: API-ACCESS-TOKEN header only
    response_model: "{pickup_stores: [...]} / {pickup_store: {...}}"
    live_credentials_required: false
    notes: >
      pickup_store_id is optional on create, so choosing a store is optional.
      POST /pickup/store is documented too and is never called: creating a
      pickup location is the seller's decision to make in RedX's panel.

  location_lookup:
    endpoint: /areas, /areas?post_code=, /areas?district_name=
    method: GET
    request_model: optional post_code or district_name
    response_model: "{areas: [{id, name, post_code, division_name, zone_id}]}"
    live_credentials_required: false
    notes: >
      The seller picks the delivery area for each RedX booking from this list.
      ecomsbd never infers an area from an address.

  price_quote:
    endpoint: /charge/charge_calculator
    method: GET
    request_model: delivery_area_id, pickup_area_id, cash_collection_amount, weight (grams)
    response_model: "{deliveryCharge, codCharge}"
    live_credentials_required: false
    notes: >
      A quote, never a cost: nothing is recorded against the order. Needs the
      chosen pickup store's area, read from /pickup/store/info.

  webhook:
    endpoint: inbound to ecomsbd, per-shop callback URL
    method: POST
    request_model: >
      Query parameter `token` carrying the shop's ecomsbd-issued secret —
      RedX's documented scheme is "credentials in the query parameters of the
      URL", with no signature header. Body (application/json):
      {tracking_number, timestamp, status, message_en, message_bn,
      invoice_number, delivery_type}.
    response_model: UNDOCUMENTED — ecomsbd answers 200 on a verified delivery
    live_credentials_required: true
    notes: >
      The route resolves the shop from an opaque routing token in the path,
      compares the query token with that shop's stored secret in constant
      time, stores every body, and dedupes by body hash (callbacks carry no
      event id). The query string is scrubbed from access logs. As with
      Pathao, verified deliveries are recorded; parcel state is kept current
      by polling.

unknowns:
  PROVIDER_CREATE_IDEMPOTENCY: unknown
  LOOKUP_BY_MERCHANT_INVOICE: unknown
  ERROR_BODY_CONTRACT: unknown
  RATE_LIMIT_CONTRACT: unknown
  PAGINATION_CONTRACT: unknown
  TOKEN_LIFETIME: unknown
  WEBHOOK_RESPONSE_CONTRACT: unknown
  PICKUP_PENDING_MEANING: unknown

blockers:
  - REDX_LIVE_CREATE_UNVERIFIED

manual_fallback: >
  Manual courier mode. The seller records the parcel and tracking code by hand,
  uploads the RedX payout statement as CSV or XLSX, and reconciliation runs on
  the imported lines exactly as it would on API-sourced payments. Manual mode
  stays available whether or not a RedX account is connected, degraded or down.

notes:
  - "PROVIDER_CREATE_IDEMPOTENCY = UNKNOWN, and LOOKUP_BY_MERCHANT_INVOICE =
     UNKNOWN. RedX never states what happens when a merchant_invoice_id is
     reused, and publishes no way to find a parcel by it. ecomsbd therefore
     provides its own safety: a stable merchant reference persisted before the
     call, a row lock, BOOKING_UNKNOWN on any ambiguous outcome, and no
     automatic re-send. An unconfirmed RedX booking is resolved by a person
     who checks RedX's panel for that invoice."
  - "The documentation's field table and its example request disagree on the
     JSON type of parcel_weight, value and pickup_store_id (string in one,
     number in the other). The example's numbers are sent; the field every
     source agrees is a string, cash_collection_amount, is sent as one."
  - "Weight: Create Parcel says 'appropriate units (e.g., kg, g)'; Get Parcel
     Details and the charge calculator both say grams. Grams are sent. An order
     with no weight is sent at ecomsbd's own 500 g default."
  - "pickup-pending appears only as the sample value of `status` in Get Parcel
     Details, with no meaning stated. It makes no parcel-state claim."
  - "No courier charge is recorded from RedX. The quote is shown, never booked
     as a cost; actual charges come from payment data."
  - "REDX_LIVE_CREATE_UNVERIFIED: create and cancel are implemented from the
     documentation and covered by tests, but have not been exercised against a
     live RedX account. That needs one deliberate, approved QA parcel."
