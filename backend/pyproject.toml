[project]
name = "ecomsbd-backend"
version = "2.3.1"
description = "ecomsbd - Bangladesh F-commerce seller financial operations system (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "redis>=5.2",
    "arq>=0.26",
    "pyjwt>=2.10",
    "cryptography>=44.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "google-auth[requests]>=2.40,<3",
    "boto3>=1.40,<2",
    "pyyaml>=6.0",
    # Read-only XLSX parsing for imports. Used with read_only=True and
    # data_only=True: no formula evaluation, and the sheet is streamed rather
    # than loaded, so a large file cannot be turned into a memory spike.
    "openpyxl>=3.1,<4",
    "sentry-sdk[fastapi]>=2.19",
    # Asia/Dhaka must resolve identically on every host. Windows has no system
    # tz database and slim Linux images usually drop it, so it is a hard
    # dependency rather than an environment assumption: business dates and the
    # Friday summary depend on it (master spec section 69).
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Courier capability manifests are read at runtime, so an installed copy of the
# package needs them as much as the source tree does.
[tool.setuptools.package-data]
"app.couriers" = ["manifests/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                 # isort
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "SIM",               # simplify
    "TID",               # tidy imports
    "RUF",
    "ASYNC",
    "S",                 # bandit-ish security
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF001", # ambiguous unicode - we ship Bangla strings on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]
"migrations/*" = ["I001"]
"app/core/config.py" = ["S105"]
# S105 flags identifiers containing "token"/"secret". In these modules those are
# enum members and field names describing token *concepts* (INVALID_TOKEN,
# TOKEN_REUSE_DETECTED, token_type: "Bearer"), not embedded credentials.
"app/core/errors.py" = ["S105"]
"app/auth/models.py" = ["S105"]
# AuthProvider.PASSWORD and AuthTokenPurpose.PASSWORD_RESET are enum members
# naming a kind of credential, not a credential.
"app/auth/identities.py" = ["S105"]
"app/common/audit.py" = ["S105"]
"app/common/pagination.py" = ["S105"]
"app/api/v1/schemas.py" = ["S105"]
# ADMIN_TOKEN_HEADER is an HTTP header *name*, not a credential.
"app/admin/auth.py" = ["S105"]
# HEADER_API_KEY / HEADER_SECRET_KEY are HTTP header *names* from the Steadfast
# documentation, not embedded credentials. The values they carry come from the
# encrypted vault and never appear in source.
"app/couriers/steadfast/contract.py" = ["S105"]
# Same reason, plus one more: WEBHOOK_INTEGRATION_SECRET_VALUE is a fixed
# protocol constant published in Pathao's own integration source, which every
# receiver must echo back on every webhook response. It authenticates nothing
# and is not any merchant's secret — those live encrypted, per account, and
# never appear in source.
"app/couriers/pathao/contract.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["arq.*", "sentry_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "postgres: test requires a real PostgreSQL database (set TEST_DATABASE_URL)",
]
